name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://quant_admin:quant_secret_dev@localhost:5432/quant_terminal_db
      TEST_DATABASE_URL: postgresql+asyncpg://quant_admin:quant_secret_dev@localhost:5432/quant_terminal_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Crear rol, bases de datos y extensiones
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./scripts/setup_db.sh

      - name: Migraciones (dev y test)
        run: |
          uv run alembic upgrade head
          DATABASE_URL="$TEST_DATABASE_URL" uv run alembic upgrade head

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy app

      - name: Pytest (incluye tests marcados db)
        run: uv run pytest

      - name: Contrato OpenAPI actualizado
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - name: Tipos de la API actualizados
        run: |
          npm run gen:api
          git diff --exit-code types/api.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
